# ═══════════════════════════════════════════════════════════
# GreenWing Analytics — Uçak Parametreleri Veritabanı
# ═══════════════════════════════════════════════════════════
#
# Bu dosya tüm uçak tiplerinin aerodinamik, motor ve yapısal
# parametrelerini içerir.
#
# NEDEN YAML:
#   • Kod değiştirmeden yeni uçak eklenebilir
#   • Okunabilir format (mühendis de okuyabilir)
#   • Yorum satırı destekler
#   • Kalibrasyon sonrası kolayca güncellenir
#
# KALİBRASYON:
#   Model Calibrator çalıştırıldıktan sonra CD0 ve tsfc_cruise
#   değerleri güncellenir. Eski değeri yorum olarak tut:
#   # CD0: 0.022  # orijinal
#   CD0: 0.0231   # kalibre edilmiş (sfc_factor=1.05)
#
# YENİ UÇAK EKLEME:
#   1. Bu dosyaya yeni blok ekle (aşağıdaki formatı takip et)
#   2. config/assumptions.py'a OEW, MTOW, MAX_FUEL, SEATS ekle
#   3. src/models/emission_model.py'a motor emisyon verisi ekle
#   4. python -m src.models.fuel_model ile test et
#
# KAYNAKLAR:
#   • Boeing/Airbus Aircraft Characteristics for Airport Planning
#   • EASA/FAA Type Certificate Data Sheets (TCDS)
#   • Eurocontrol BADA (Base of Aircraft Data)
#   • Jane's All the World's Aircraft
#   • Motor üreticisi performans kılavuzları
#
# BİRİMLER:
#   Kütle    : kg
#   Uzunluk  : m (kanat), ft (irtifa)
#   Alan     : m²
#   Hız      : Mach (cruise), ft (irtifa)
#   Thrust   : Newton (N)
#   SFC      : kg/(N·s)
#   Menzil   : Nm (deniz mili)
#
# SON GÜNCELLEME: 2025-Q1
# ═══════════════════════════════════════════════════════════


aircraft_types:

  # ─────────────────────────────────────────────────────────
  # BOEING 737-800
  # ─────────────────────────────────────────────────────────
  # En yaygın dar gövde uçak. Dünyada 4500+ aktif.
  # Pegasus, THY, Ryanair, FlyDubai, SunExpress kullanıyor.
  # Kaynak: Boeing 737-800 Airport Planning Document D6-58325-6
  #         EASA TCDS A.064, BADA 3.15
  
  B738:
    name: "Boeing 737-800"
    manufacturer: "Boeing"
    engine_type: "CFM56-7B26"
    num_engines: 2

    # ─── Ağırlık limitleri (kg) ──────────────────────────
    # MTOW: Maximum Takeoff Weight (sertifikasyon limiti, değişmez)
    # OEW: Operating Empty Weight (konfigürasyona göre değişebilir)
    #      Standart 2-class 162 koltuk konfigürasyonu
    #      Gerçek OEW müşteriden alınmalı (±3% fark olabilir)
    # max_fuel: Yakıt tank kapasitesi (fiziksel limit)
    # max_payload: Yapısal payload limiti
    mtow: 79016
    oew: 41413
    max_fuel: 20894          # üretici (Boeing/Airbus ACM)
    max_payload: 20244

    # ─── Kanat geometrisi ────────────────────────────────
    # wing_area: Referans kanat alanı (m²)
    #   Tüm CL ve CD hesaplarında kullanılır
    #   CL = W/(q×S), D = q×S×CD
    # wingspan: Kanat açıklığı (m)
    #   Aspect ratio hesabında: AR = b²/S
    #   İndüktif drag (K) hesabında: K = 1/(π×e×AR)
    wing_area: 124.6          # OpenAP v3 wing.area
    wingspan: 34.32         # OpenAP v3 wing.span

    # ─── Performans limitleri ────────────────────────────
    # cruise_mach: Tipik cruise Mach sayısı
    #   Cost Index'e göre M0.74-M0.82 arası değişir
    #   Bu varsayılan değer. Optimizasyonda override edilir.
    # max_altitude: Maksimum operasyonel irtifa (ft)
    #   Sertifikasyon tavanı. Optimizer bu üstüne çıkmaz.
    # range_nm: Maksimum menzil (Nm)
    #   Referans bilgisi. Rota fizibilitesi için.
    # passengers_typical: Tipik yolcu kapasitesi
    #   CO2/pax/km metriği için. Havayoluna göre değişir.
    #   Ryanair: 189, standart: 162, business mix: 148
    cruise_mach: 0.785
    max_altitude: 41000
    range_nm: 2935
    passengers_typical: 162

    # ─── Aerodinamik parametreler ────────────────────────
    # CD0: Sıfır kaldırma drag katsayısı (parasitic drag)
    #   Gövde, kanat profil, nacelle, antenler toplamı
    #   Yeni uçak: 0.021-0.022
    #   10 yaşında: 0.023-0.024
    #   20 yaşında: 0.024-0.026
    #   KALİBRASYON: cd0_factor ile çarpılır
    #   Kanat yıkama sonrası %1-2 düşer
    #
    # K: İndüktif drag faktörü
    #   K = 1/(π × e × AR)
    #   Winglet etkisi: K %8-12 azalır
    #   B738 blended winglet: e=0.85, K=0.045
    #   B738 split scimitar: e=0.87, K=0.043
    #
    # e: Oswald verimlilik faktörü
    #   İdeal eliptik kanat: e=1.0
    #   Gerçek: e=0.80-0.90
    #   Winglet varsa daha yüksek
    #
    # AR: Aspect Ratio (kanat en-boy oranı)
    #   AR = wingspan² / wing_area = 35.8² / 124.6 = 10.27
    #   Sabit (geometrik özellik)
    CD0: 0.0190
    K: 0.04200
    e: 0.7990
    AR: 9.453            # span²/area (OpenAP geometrisi)

    # ─── Motor parametreleri ─────────────────────────────
    # tsfc_cruise: Cruise SFC (Thrust Specific Fuel Consumption)
    #   Birim: kg/(N·s)
    #   "1 Newton thrust üretmek için saniyede kaç kg yakıt"
    #   Bu REFERANS değer. İrtifa ve Mach ile düzeltilir:
    #     SFC = tsfc_cruise × √(θ/δ) × (1 - 0.10 × (M - 0.80))
    #   KALİBRASYON: sfc_factor ile çarpılır
    #   Yeni motor: 0.0000175-0.0000178
    #   Yaşlı motor: 0.0000180-0.0000190
    #   Motor yıkama sonrası %0.5-1 düşer
    #
    # max_thrust_sl: Deniz seviyesi maksimum thrust (N, toplam)
    #   İki motorun toplam thrust'ı
    #   İrtifada azalır: T_available ≈ T_sl × δ × 0.95
    #   Thrust yeterliliği kontrolünde kullanılır
    #
    # Kaynak: CFM International, EASA Engine TCDS E.067
    tsfc_cruise: 0.00001767
    # ICAO EDB yakıt modeli katsayıları (OpenAP); kaynak:
    # data/openap/fuel/fuel_models.csv. FF[kg/s] = c1−exp(−c2(r·e^(c3r)−ln c1/c2))
    # Kaynak: ICAO EDB / OpenAP — doğrudan ICAO EDB (B738)
    fuel_coef: [1.075485, 1.877730, 1.889552]
    max_thrust_sl: 121400

    # ─── Buffet sınırları (opsiyonel, PhysicsValidator'da) ─
    # Şu an physics_validator.py içinde sabit tablo.
    # İleride buraya taşınabilir.
    # buffet_cl:
    #   M070: 0.72
    #   M074: 0.68
    #   M078: 0.62
    #   M080: 0.58
    #   M082: 0.54


  # ─────────────────────────────────────────────────────────
  # BOEING 737 MAX 8
  # ─────────────────────────────────────────────────────────
  # B738'in yeni nesil versiyonu. LEAP-1B motor.
  # %14 daha az yakıt tüketimi (üreticiye göre).
  # Kaynak: Boeing 737 MAX Airport Planning D6-58326
  #         EASA TCDS A.064 Rev.72

  B38M:
    name: "Boeing 737 MAX 8"
    manufacturer: "Boeing"
    engine_type: "LEAP-1B"
    num_engines: 2

    mtow: 82191
    oew: 45070  # Boeing dokümanı (Ağu 2017); 44280 hatalıydı
    max_fuel: 20894          # üretici (Boeing/Airbus ACM)
    max_payload: 20886

    wing_area: 124.6          # OpenAP v3 wing.area
    wingspan: 34.32         # OpenAP v3 wing.span

    cruise_mach: 0.79
    max_altitude: 41000
    range_nm: 3550
    passengers_typical: 178  # 737 MAX 8 tipik 2-class

    # LEAP-1B: Daha yüksek BPR (9.0), daha düşük SFC
    # Yeni kanat tasarımı: daha düşük CD0
    # Split-tip winglet: daha düşük K
    CD0: 0.0200
    K: 0.04200
    e: 0.7970
    AR: 9.453            # span²/area (OpenAP geometrisi)

    # LEAP-1B SFC: CFM56'dan %15 daha iyi
    tsfc_cruise: 0.00001573
    # ICAO EDB yakıt modeli katsayıları (OpenAP); kaynak:
    # data/openap/fuel/fuel_models.csv. FF[kg/s] = c1−exp(−c2(r·e^(c3r)−ln c1/c2))
    # Kaynak: ICAO EDB / OpenAP — default × ff_to(LEAP-1B27) = 1.014
    # ⚠ TAHMİN — bu tip ICAO EDB'de (OpenAP fuel_models.csv) YOK.
    #   Katsayı DEFAULT×ff_to türetmesidir; c2/c3 tüm tiplerde aynıdır.
    #   Denetim #78: A20N −%17 · B77W +%63 · B789 +%26 sapma ölçüldü.
    #   Gerçek yakıt için müşteri OFP verisi veya EDB 2.0 gerekli.
    fuel_coef: [0.950691, 1.976761, 1.395479]
    max_thrust_sl: 130280


