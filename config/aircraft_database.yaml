# ═══════════════════════════════════════════════════════════
# PARAMETRE AÇIKLAMA TABLOSU
# ═══════════════════════════════════════════════════════════
#
# PARAMETRE         BİRİM       AÇIKLAMA                    DEĞİŞİR Mİ?
# ─────────────────────────────────────────────────────────────────────
# name              -           Uçak tam adı                Hayır
# manufacturer      -           Üretici                     Hayır
# engine_type       -           Motor tipi (ICAO)           Varyant ile
# num_engines       -           Motor sayısı                Hayır
# mtow              kg          Max kalkış ağırlığı         Hayır (sertifikasyon)
# oew               kg          Boş operasyonel ağırlık     Evet (konfigürasyon)
# max_fuel          kg          Yakıt tank kapasitesi       Hayır (fiziksel)
# max_payload       kg          Max yük kapasitesi          Hayır (yapısal)
# wing_area         m²          Referans kanat alanı        Hayır (geometrik)
# wingspan          m           Kanat açıklığı              Hayır (geometrik)
# cruise_mach       -           Tipik cruise Mach           Override edilir (CI)
# max_altitude      ft          Operasyonel tavan           Hayır (sertifikasyon)
# range_nm          Nm          Maks menzil                 Hayır (referans)
# passengers_typical -          Tipik yolcu sayısı          Evet (havayoluna göre)
# CD0               -           Parasitic drag katsayısı    Evet (kalibrasyon)
# K                 -           İndüktif drag faktörü       Az (winglet ile)
# e                 -           Oswald verimlilik           Az
# AR                -           Aspect ratio                Hayır (geometrik)
# tsfc_cruise       kg/(N·s)    Cruise SFC                  Evet (kalibrasyon)
# max_thrust_sl     N           SL maksimum thrust          Varyant ile
#
# ═══════════════════════════════════════════════════════════
# EKLENEBİLECEK GELECEK TİPLER:
# ═══════════════════════════════════════════════════════════
